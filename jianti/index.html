<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>简体字ノート</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Serif+JP:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Sans:ital,wght@0,500;1,500&display=swap">
<style>
/* Layout: one narrow column like a copybook page; the 米字格 practice square is the hero of every view. */
:root {
  --paper: #f5f7f3;
  --sheet: #ffffff;
  --ink: #1b211e;
  --ink-soft: #5b6660;
  --line: #d9e0da;
  --grid: #8fc4a6;          /* green guide lines, like a 田字格 notebook */
  --jade: #1d6b4c;          /* 简体字 accent */
  --jade-wash: #e3f0e8;
  --indigo: #39477f;        /* 日本漢字 accent */
  --indigo-wash: #e7e9f4;
  --good: #1d7a45;
  --bad: #b23a2e;
  --bad-wash: #f8e5e2;
  --font-cn: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --font-jp: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-ui: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --font-py: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121614; --sheet: #1a201d; --ink: #e6ece8; --ink-soft: #9aa7a0; --line: #2c3531;
    --grid: #2f6a4b; --jade: #6fd1a0; --jade-wash: #1d3329; --indigo: #a7b3ec; --indigo-wash: #242a44;
    --good: #6fd1a0; --bad: #f08a7c; --bad-wash: #3a2220; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121614; --sheet: #1a201d; --ink: #e6ece8; --ink-soft: #9aa7a0; --line: #2c3531;
  --grid: #2f6a4b; --jade: #6fd1a0; --jade-wash: #1d3329; --indigo: #a7b3ec; --indigo-wash: #242a44;
  --good: #6fd1a0; --bad: #f08a7c; --bad-wash: #3a2220; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.cn { font-family: var(--font-cn); }
.jp { font-family: var(--font-jp); }
.py { font-family: var(--font-py); font-style: italic; letter-spacing: .02em; }
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--jade); outline-offset: 2px; }

header { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand h1 { margin: 0; font-size: 26px; line-height: 1.2; font-weight: 700; letter-spacing: .04em; }
.brand h1 .cn { color: var(--jade); }
.brand p { margin: 2px 0 0; color: var(--ink-soft); font-size: 13px; }
.progress { min-width: 160px; flex: 0 1 220px; font-size: 12px; color: var(--ink-soft); }
.progress .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 4px; }
.progress .bar i { display: block; height: 100%; background: var(--jade); width: 0; transition: width .4s; }
.progress b { color: var(--ink); font-variant-numeric: tabular-nums; }

nav { display: grid; grid-template-columns: repeat(5, 1fr); border: 1px solid var(--line); border-radius: 10px; background: var(--sheet); padding: 4px; gap: 4px; }
nav button { border: 0; background: transparent; padding: 8px 2px; white-space: nowrap; border-radius: 7px; font-weight: 500; font-size: 14px; color: var(--ink-soft); }
nav button[aria-selected="true"] { background: var(--jade-wash); color: var(--jade); font-weight: 700; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--sheet); border-radius: 999px; padding: 4px 12px; font-size: 13px; color: var(--ink-soft); }
.chiprow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; width: 100%; }
.chiplabel { font-size: 11px; letter-spacing: .1em; font-weight: 700; color: var(--ink-soft); margin-right: 2px; }
.origin { display: flex; flex-direction: column; gap: 8px; padding-top: 14px; border-top: 1px solid var(--line); }
.originhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.originhead h2 { margin: 0; font-size: 18px; text-wrap: balance; }
.chip[aria-pressed="true"] { border-color: var(--jade); color: var(--jade); background: var(--jade-wash); font-weight: 700; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.toggle { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--ink-soft); }

/* 米字格 */
.mizi { position: relative; aspect-ratio: 1; max-width: 100%; border: 2px solid var(--grid); background: var(--sheet); display: grid; place-items: center; }
.mizi svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.mizi svg line { stroke: var(--grid); stroke-width: 1; stroke-dasharray: 4 4; }
.mizi span { position: relative; line-height: 1; }

/* Flashcard */
.card { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.pair { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 14px; }
.side { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; }
.side .mizi { width: min(100%, 170px); }
.side .mizi span { font-size: clamp(72px, 22vw, 116px); }
.side.jpside .mizi { border-color: var(--line); }
.side.jpside .mizi svg line { stroke: var(--line); }
.side.jpside .mizi span { color: var(--indigo); }
.side.cnside .mizi span { color: var(--jade); }
.label { font-size: 11px; letter-spacing: .12em; color: var(--ink-soft); font-weight: 700; }
.arrow { color: var(--ink-soft); font-size: 22px; }
.hidden-char { color: var(--ink-soft) !important; opacity: .35; font-family: var(--font-ui) !important; font-size: 56px !important; }
.meta { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; min-height: 64px; }
.meta .py { font-size: 24px; color: var(--ink); }
.meta .mean { color: var(--ink-soft); font-size: 14px; }
.tag { display: inline-block; font-size: 12px; padding: 2px 10px; border-radius: 999px; background: var(--indigo-wash); color: var(--indigo); font-weight: 500; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { border: 1px solid var(--line); background: var(--sheet); border-radius: 10px; padding: 12px; font-weight: 700; font-size: 15px; }
.btn.primary { background: var(--jade); border-color: var(--jade); color: var(--sheet); }
.btn.ghost { color: var(--ink-soft); font-weight: 500; }
.btn.full { grid-column: 1 / -1; }
.speak { border: 1px solid var(--line); background: var(--sheet); border-radius: 999px; width: 36px; height: 36px; display: inline-grid; place-items: center; color: var(--jade); }
.speak svg { width: 18px; height: 18px; }
.cardfoot { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

/* Quiz */
.qprompt { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.qprompt .mizi { width: 150px; }
.qprompt .mizi span { font-size: 104px; }
.options { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.opt { border: 1px solid var(--line); background: var(--sheet); border-radius: 12px; aspect-ratio: 1; font-size: clamp(34px, 10vw, 48px); line-height: 1; display: grid; place-items: center; }
.opt.right { border-color: var(--good); background: var(--jade-wash); color: var(--good); }
.opt.wrong { border-color: var(--bad); background: var(--bad-wash); color: var(--bad); }
.opt:disabled { cursor: default; }
.feedback { text-align: center; min-height: 52px; font-size: 14px; }
.feedback strong.ok { color: var(--good); }
.feedback strong.ng { color: var(--bad); }
.dots { display: flex; gap: 4px; justify-content: center; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.dots i.ok { background: var(--good); }
.dots i.ng { background: var(--bad); }
.dots i.now { outline: 2px solid var(--jade); outline-offset: 1px; }
.result { text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.result .score { font-size: 48px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--jade); line-height: 1.1; }
.misslist { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.miss { border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; font-size: 18px; }

/* List */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 8px; }
.cell { border: 1px solid var(--line); background: var(--sheet); border-radius: 10px; padding: 8px 4px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative; }
.cell .c { font-size: 30px; line-height: 1.1; color: var(--jade); }
.cell .j { font-size: 13px; color: var(--indigo); }
.cell.known::after { content: ""; position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.cell[aria-expanded="true"] { border-color: var(--jade); }
.detail { background: var(--sheet); border: 1px solid var(--jade); border-radius: 12px; padding: 14px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.detail .big { font-size: 56px; line-height: 1; }
.detail .txt { flex: 1; min-width: 160px; display: flex; flex-direction: column; gap: 2px; }
.legend { font-size: 12px; color: var(--ink-soft); display: flex; gap: 14px; flex-wrap: wrap; }
.legend span::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--good); margin-right: 5px; vertical-align: middle; }

/* Rules */
.intro { color: var(--ink-soft); font-size: 14px; margin: 0; max-width: 60ch; }
.rules { display: flex; flex-direction: column; gap: 10px; }
.rule { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; align-items: center; }
.rad { display: flex; align-items: center; gap: 8px; font-size: 32px; line-height: 1; }
.rad .jp { color: var(--indigo); }
.rad .cn { color: var(--jade); }
.rad small { font-size: 16px; color: var(--ink-soft); }
.ex { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 17px; }
.ex button { border: 0; background: none; padding: 0; }
.ex .jp { color: var(--indigo); }
.ex .cn { color: var(--jade); }
.ex .to { color: var(--ink-soft); font-size: 12px; margin: 0 2px; }
.rule .note { grid-column: 1 / -1; font-size: 12px; color: var(--ink-soft); }
.tip { border-left: 3px solid var(--grid); padding: 6px 12px; font-size: 13px; color: var(--ink-soft); background: var(--sheet); border-radius: 0 8px 8px 0; }

@media (max-width: 460px) {
  .pair { gap: 8px; }
  .arrow { font-size: 16px; }
  .card { padding: 16px 12px; }
}
/* 出題範囲 */
.selwrap { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-soft); flex: 1 1 260px; min-width: 0; }
.selwrap select { flex: 1; min-width: 0; font: inherit; font-size: 14px; color: var(--ink); background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px; }
/* パーツ */
.partsec { display: flex; flex-direction: column; gap: 10px; }
.sechead h2 { margin: 0 0 2px; font-size: 18px; }
.compgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.comp { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
.comp.open { grid-column: 1 / -1; border-color: var(--jade); }
.comphead { width: 100%; border: 0; background: none; padding: 10px 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left; border-radius: 12px; }
.compglyph { display: flex; align-items: center; gap: 6px; font-size: 30px; line-height: 1; }
.compglyph .jp { color: var(--indigo); }
.compglyph .cn { color: var(--jade); }
.compglyph small { font-size: 14px; color: var(--ink-soft); }
.compname { display: flex; flex-wrap: wrap; gap: 0 8px; font-size: 12px; color: var(--ink-soft); line-height: 1.4; min-width: 0; }
.compname span { font-variant-numeric: tabular-nums; }
.compbody { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 10px; }
.compactions { display: flex; gap: 6px; flex-wrap: wrap; }
.ex button.isknown .cn { text-decoration: underline; text-decoration-color: var(--good); text-underline-offset: 4px; }
/* 組み立て */
.buildtop { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.buildrow { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: start; }
.buildrow .mizi { width: min(100%, 150px); }
.buildrow .mizi span { font-size: clamp(64px, 20vw, 100px); }
.buildrow .jpside .mizi span { color: var(--indigo); }
.buildrow .arrow { align-self: center; }
.partsjp { font-size: 18px; color: var(--ink-soft); }
.partsjp .jp { color: var(--indigo); }
.slots { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; width: min(100%, 150px); aspect-ratio: 1; }
.slot { border: 2px dashed var(--grid); border-radius: 8px; display: grid; place-items: center; background: var(--sheet); font-size: clamp(30px, 9vw, 44px); line-height: 1; color: var(--jade); }
.slot.empty { color: var(--ink-soft); font-family: var(--font-ui); font-size: 24px; opacity: .5; }
.slot.right { border-style: solid; border-color: var(--good); background: var(--jade-wash); }
.slot.wrong { border-style: solid; border-color: var(--bad); background: var(--bad-wash); color: var(--bad); }
.partglyph, .opt.part { font-family: "Noto Serif SC", "Noto Serif JP", "Songti SC", serif; }
.steplabel { text-align: center; font-weight: 700; display: flex; flex-direction: column; gap: 2px; }
.steplabel span { font-weight: 400; font-size: 12px; color: var(--ink-soft); }
.buildresult { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
.buildresult .mizi { width: 120px; }
.buildresult .mizi span { font-size: 84px; color: var(--jade); }
.buildresult .txt { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.partline { font-size: 22px; }
.okc { color: var(--good); }
.ngc { color: var(--bad); }
.tag.parttag { background: var(--jade-wash); color: var(--jade); }
@media (max-width: 460px) {
  nav button { font-size: 13px; }
  .buildresult { grid-template-columns: 1fr; justify-items: center; text-align: center; }
  .buildresult .txt { align-items: center; }
}

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* 中国語だけの字・意味が違う語 */
.glossbox { width: min(100%, 170px); aspect-ratio: 1; max-width: 100%; border: 2px solid var(--line); background: var(--sheet); display: grid; place-items: center; text-align: center; padding: 10px; font-size: clamp(16px, 4.6vw, 22px); font-weight: 700; color: var(--indigo); line-height: 1.4; }
.qprompt .glossbox { width: 150px; }
.word { font-size: clamp(56px, 17vw, 92px); color: var(--jade); line-height: 1.15; text-align: center; letter-spacing: .06em; }
.wordbox { display: flex; flex-direction: column; align-items: center; gap: 8px; padding-block: 10px; border-block: 1px dashed var(--grid); }
.trapnote { color: var(--ink-soft); font-size: 14px; text-align: center; }
.trapnote b { color: var(--indigo); }
.compare { display: grid; gap: 8px; width: 100%; text-align: left; }
.compare > div { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 10px 12px; border-radius: 10px; background: var(--jade-wash); }
.compare > div.jprow { background: var(--indigo-wash); }
.compare .k { font-size: 11px; letter-spacing: .1em; font-weight: 700; color: var(--ink-soft); min-width: 7em; }
.compare .v { font-weight: 700; }
.example { font-size: 14px; color: var(--ink-soft); display: flex; flex-wrap: wrap; gap: 4px 10px; justify-content: center; align-items: baseline; }
.example .cn { font-size: 20px; color: var(--ink); }
.meta .example .py, .example .py { font-size: 15px; }
.options.textopts { grid-template-columns: 1fr 1fr; }
.opt.text { aspect-ratio: auto; font-family: var(--font-ui); font-size: 15px; line-height: 1.4; padding: 14px 10px; min-height: 64px; }
.cell .j.small { font-size: 11px; line-height: 1.3; text-align: center; padding-inline: 2px; overflow-wrap: anywhere; }
.cell.wordcell .c { font-size: 22px; padding-block: 4px; }
.cell.wordcell .j { color: var(--bad); }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand">
      <h1><span class="cn">简体字</span>ノート</h1>
      <p>部首とつくりに注目して、日本の漢字から简体字へ。</p>
    </div>
    <div class="progress" aria-live="polite">
      覚えた字 <b id="knownCount">0</b> / <b id="totalCount">0</b>
      <div class="bar"><i id="knownBar"></i></div>
    </div>
  </header>

  <nav role="tablist" aria-label="モード">
    <button role="tab" id="tab-parts" data-view="parts" aria-selected="true">パーツ</button>
    <button role="tab" id="tab-build" data-view="build" aria-selected="false">組み立て</button>
    <button role="tab" id="tab-card" data-view="card" aria-selected="false">カード</button>
    <button role="tab" id="tab-quiz" data-view="quiz" aria-selected="false">クイズ</button>
    <button role="tab" id="tab-rules" data-view="rules" aria-selected="false">由来</button>
  </nav>

  <div class="toolbar" id="filterBar" hidden>
    <label class="selwrap" for="groupSel"><span>出題範囲</span><select id="groupSel"></select></label>
    <label class="toggle"><input type="checkbox" id="onlyUnknown"> まだ覚えていない字だけ</label>
  </div>

  <section id="view-parts"></section>
  <section id="view-build" hidden></section>
  <section id="view-card" hidden></section>
  <section id="view-quiz" hidden></section>
  <section id="view-rules" hidden></section>
</div>

<script>
// [日本漢字, 简体字, pinyin, 意味, グループ(r=部首 / w=形が大きく違う / s=少しだけ違う), 部首キー]

  { key: "東", cn: "东", pos: "tsukuri", name: "凍・棟・陳の右", chars: "東凍棟陳", note: "草書から作られた东が、部品でもそのまま使われる。" },
  { key: "尭", cn: "尧", pos: "tsukuri", name: "焼・暁の右", chars: "焼暁", note: "点や画の数が少し違う。" },
  { key: "倉", cn: "仓", pos: "tsukuri", name: "倉・創・槍の部品", chars: "倉創槍", note: "cang / chuang / qiang と読む字に共通。" },
  { key: "単", cn: "单", pos: "tsukuri", name: "弾の右", chars: "単弾", note: "上の点の向きが違う（日本 ツ、中国 丷）。" },
  { key: "義", cn: "义", pos: "tsukuri", name: "議・儀の右", chars: "義議儀", note: "画数の多い義を、まるごと义に。" },
  { key: "咼", cn: "呙", pos: "tsukuri", name: "鍋・渦・禍の右", chars: "鍋渦禍", note: "日本では咼のまま。中国では呙。" },
  { key: "亜", cn: "亚", pos: "tsukuri", name: "悪の上", chars: "亜悪", note: "悪→恶。上の部分が亚になる。" },
  { key: "両", cn: "两", pos: "tsukuri", name: "満の右", chars: "両満", note: "満→满。中の形が两になる。" },
  { key: "発", cn: "发", pos: "tsukuri", name: "廃の中", chars: "発廃", note: "廃→废。発の部分が发になる。" },
  { key: "為", cn: "为", pos: "tsukuri", name: "偽の右", chars: "為偽", note: "偽→伪。為の部分が为になる。" },
];
const COMP = Object.fromEntries(COMPONENTS.map((c) => [c.key, c]));
for (const c of COMPONENTS) {
  c.items = [...c.chars].map((j) => BY_JP.get(j)).filter(Boolean);
  c.items.forEach((x) => x.parts.push(c.key));
}

// 組み立て用: [日本の字, 日本の左, 日本の右, 中国の左, 中国の右]

const LEFT_POOL = [...new Set(BUILD.flatMap((b) => [b.lc, b.lj]))];
const RIGHT_POOL = [...new Set(BUILD.flatMap((b) => [b.rc, b.rj]))];

// 简体字の作り方（由来）。分類は代表的な説明に沿ったもので、複数の由来が重なる字もある。
const ORIGINS = [
  { key: "r", name: "部首・つくりの類推", desc: "部首やつくりなどの部品をまとめて簡略化したもの。部品を覚えれば、知らない字でもかなり予想できます。部品ごとの一覧は「パーツ」タブにあります。" },
  { key: "cs", name: "草書から", desc: "筆で崩して書いた草書の形を、楷書の形に直したもの。書→书、東→东、長→长、為→为 など、元の字と見た目が大きく変わります。" },
  { key: "pt", name: "一部を残す", desc: "字の特徴的な部分や輪郭だけを残したもの。飛→飞、習→习、業→业、開→开（門を外す）、歯→齿 など。" },
  { key: "hm", name: "同音で代用", desc: "画数の少ない既存の字を当てたもの。多くは同じか近い発音です。後→后、麺→面、幾→几、葉→叶。元は別の字だったので、1字に2つの意味が合流しています。" },
  { key: "an", name: "古字・俗字", desc: "昔から手書きなどで使われていた簡単な字体を、正式な字にしたもの。雲→云、衆→众、無→无、個→个 など。" },
  { key: "ph", name: "音符を交換", desc: "発音を表す部分（音符）を、同じか近い音の簡単な字に替えたもの。遠→远（元 yuán）、運→运（云 yún）、億→亿（乙 yì）、戦→战（占 zhàn）、華→华（化 huà）。" },
  { key: "sy", name: "記号に置換", desc: "複雑な部分を「又」「寸」「不」などの単純な形に置き換えたもの。発音とは関係しません。漢→汉、対→对、過→过、還→还。" },
  { key: "hy", name: "新しい会意", desc: "意味を表す部品を組み合わせて作り直したもの。涙→泪（水＋目）、陽→阳（日）、陰→阴（月）、筆→笔（竹＋毛）、隊→队（人）。" },
  { key: "s", name: "字体の小差", desc: "简体字化というより、日本の新字体と中国の字体で細部が違うもの。点や画の有無に注意。歩/步、黒/黑、決/决、強/强。" },
];
const VOCAB = [
  { key: "c", name: "中国語だけの字" },
  { key: "f", name: "意味が違う語" },
];
const GROUP_TAG = Object.fromEntries([...ORIGINS, ...VOCAB].map((g) => [g.key, g.name]));

// ---- per-viewer progress (browser only) ----
let known = new Set();
try { known = new Set(JSON.parse(localStorage.getItem("jianti-known") || "[]")); } catch (e) {}
function saveKnown() { try { localStorage.setItem("jianti-known", JSON.stringify([...known])); } catch (e) {} updateProgress(); }
function key(x) { return x.kind === "pair" ? x.jp + x.cn : x.kind + ":" + x.cn; }

const state = { view: "parts", group: "all", onlyUnknown: false, deck: [], pos: 0, flipped: false, quiz: null, openComp: null, build: null };

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const MIZI_SVG = '<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><line x1="50" y1="0" x2="50" y2="100"/><line x1="0" y1="50" x2="100" y2="50"/><line x1="0" y1="0" x2="100" y2="100"/><line x1="100" y1="0" x2="0" y2="100"/></svg>';
const SPEAK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const canSpeak = typeof window.speechSynthesis !== "undefined";
function speak(text) {
  if (!canSpeak) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-CN"; u.rate = 0.8;
    const v = speechSynthesis.getVoices().find((v) => /zh[-_]CN/i.test(v.lang));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function speakBtn(text) { return canSpeak ? `<button class="speak" data-speak="${esc(text)}" aria-label="発音を聞く">${SPEAK_SVG}</button>` : ""; }
function sayText(x) { return x.kind === "c" ? x.ex : x.cn; }

const cnSpan = (s, style = "") => `<span class="cn" lang="zh-Hans"${style ? ` style="${style}"` : ""}>${esc(s)}</span>`;
const jpSpan = (s, style = "") => `<span class="jp" lang="ja"${style ? ` style="${style}"` : ""}>${esc(s)}</span>`;
const pySpan = (s, style = "") => `<span class="py" lang="zh-Latn-pinyin"${style ? ` style="${style}"` : ""}>${esc(s)}</span>`;
const mizi = (inner, jpStyle) => `<div class="mizi"${jpStyle ? ' style="border-color:var(--line)"' : ""}>${jpStyle ? MIZI_SVG.replace(/<line/g, '<line style="stroke:var(--line)"') : MIZI_SVG}${inner}</div>`;
const partsLabel = (x) => (x.parts || []).map((k) => `${k}→${COMP[k].cn}`).join("・");

function inGroup(x, g) {
  if (g === "all") return true;
  if (g.startsWith("p:")) return x.parts.includes(g.slice(2));
  return x.g === g;
}
function pool() {
  return ALL.filter((x) => inGroup(x, state.group) && (!state.onlyUnknown || !known.has(key(x))));
}

function updateProgress() {
  const n = ALL.filter((x) => known.has(key(x))).length;
  $("#knownCount").textContent = n;
  $("#totalCount").textContent = ALL.length;
  $("#knownBar").style.width = (100 * n / ALL.length) + "%";
}

function renderSelect() {
  const opt = (k, label, n) => `<option value="${k}"${state.group === k ? " selected" : ""}>${esc(label)}（${n}）</option>`;
  const comps = (pos) => COMPONENTS.filter((c) => c.pos === pos).map((c) => opt("p:" + c.key, `${c.key}→${c.cn}　${c.name}`, c.items.length)).join("");
  $("#groupSel").innerHTML = opt("all", "すべて", ALL.length)
    + `<optgroup label="部首">${comps("bushu")}</optgroup>`
    + `<optgroup label="つくり・部品">${comps("tsukuri")}</optgroup>`
    + `<optgroup label="作り方">${ORIGINS.map((o) => opt(o.key, o.name, ALL.filter((x) => x.g === o.key).length)).join("")}</optgroup>`
    + `<optgroup label="語彙">${VOCAB.map((o) => opt(o.key, o.name, ALL.filter((x) => x.g === o.key).length)).join("")}</optgroup>`;
}
function groupName(g) {
  if (g === "all") return "すべて";
  if (g.startsWith("p:")) { const c = COMP[g.slice(2)]; return `${c.key}→${c.cn}`; }
  return GROUP_TAG[g];
}

// ---- Parts view ----
function exampleBtns(items) {
  return items.map((x) => `<button data-jump="${x.id}" class="${known.has(key(x)) ? "isknown" : ""}"><span class="jp" lang="ja">${x.jp}</span><span class="to">→</span><span class="cn" lang="zh-Hans">${x.cn}</span></button>`).join("");
}
function compCard(c) {
  const open = state.openComp === c.key;
  const done = c.items.filter((x) => known.has(key(x))).length;
  return `<div class="comp${open ? " open" : ""}">
    <button class="comphead" data-comp="${esc(c.key)}" aria-expanded="${open}">
      <span class="compglyph"><span class="jp" lang="ja">${c.key}</span><small aria-hidden="true">→</small><span class="cn" lang="zh-Hans">${c.cn}</span></span>
      <span class="compname">${esc(c.name)}<span>${done}/${c.items.length}字</span></span>
    </button>
    ${open ? `<div class="compbody">
      <p class="intro">${esc(c.note)}</p>
      <div class="ex">${exampleBtns(c.items)}</div>
      <div class="compactions">
        <button class="chip" data-practice="p:${esc(c.key)}" data-to="card">カードで練習</button>
        <button class="chip" data-practice="p:${esc(c.key)}" data-to="quiz">クイズ</button>

      </div>
    </div>` : ""}
  </div>`;
}
function renderParts() {
  const sec = (pos, title, lead) => `<section class="partsec">
    <div class="sechead"><h2>${title}</h2><p class="intro">${lead}</p></div>
    <div class="compgrid">${COMPONENTS.filter((c) => c.pos === pos).map(compCard).join("")}</div>
  </section>`;
  $("#view-parts").innerHTML = `<div style="display:flex;flex-direction:column;gap:22px">
    ${sec("bushu", "部首", "よく出る12の部首。左側（偏）や右側に来たときの形を覚えると、その部首を持つ字がまとめて読めます。")}
    ${sec("tsukuri", "つくり・部品", "右側（旁）や中の部品も、同じ形ならまとめて簡略化されます。部品の形が日本と中国で別々に変わったものもあります。")}
    <div class="tip">部品をタップすると、その部品を含む字と練習ボタンが出ます。字をタップするとカードで答えを確認できます。</div>
  </div>`;
}

// ---- Build view ----
function pickOpts(correct, trap, poolArr) {
  const out = [correct];
  if (trap !== correct) out.push(trap);
  for (const p of shuffle(poolArr)) { if (out.length >= 4) break; if (!out.includes(p)) out.push(p); }
  return shuffle(out);
}
function buildList() {
  const g = state.group.startsWith("p:") ? state.group.slice(2) : null;
  const list = BUILD.filter((b) => !g || b.x.parts.includes(g));
  return list.length ? list : BUILD;
}
function newBuildRound() {
  const list = shuffle(buildList());
  state.build = { list, i: 0, ok: 0, n: 0, scope: state.group.startsWith("p:") ? state.group : "all" };
  setBuildItem();
}
function setBuildItem() {
  const B = state.build, b = B.list[B.i];
  B.cur = { b, optsL: pickOpts(b.lc, b.lj, LEFT_POOL), optsR: pickOpts(b.rc, b.rj, RIGHT_POOL), l: null, r: null };
}
function slot(v, ok) {
  if (v == null) return `<div class="slot empty">?</div>`;
  return `<div class="slot ${ok == null ? "" : ok ? "right" : "wrong"}"><span class="partglyph">${esc(v)}</span></div>`;
}
function renderBuild() {
  const B = state.build, c = B.cur, b = c.b;
  const doneBoth = c.l != null && c.r != null;
  const okL = c.l == null ? null : c.l === b.lc, okR = c.r == null ? null : c.r === b.rc;
  const step = c.l == null ? "L" : c.r == null ? "R" : "done";
  const opts = step === "L" ? c.optsL : step === "R" ? c.optsR : [];
  const scopeNote = B.scope === "all" ? `全${B.list.length}字` : `${groupName(B.scope)} の${B.list.length}字`;
  $("#view-build").innerHTML = `<div class="card">
    <div class="buildtop"><span>${scopeNote}・${B.i + 1}問目</span><span>正解 ${B.ok} / ${B.n}</span>
      ${B.scope !== "all" ? `<button class="chip" data-act="buildAll">全部の字で</button>` : ""}</div>
    <div class="buildrow">
      <div class="side jpside"><span class="label">日本の漢字</span>${mizi(jpSpan(b.x.jp), true)}
        <span class="partsjp">${jpSpan(b.lj)} ＋ ${jpSpan(b.rj)}</span></div>
      <span class="arrow" aria-hidden="true">→</span>
      <div class="side"><span class="label">简体字の部品</span>
        <div class="slots">${slot(c.l, doneBoth ? okL : null)}${slot(c.r, doneBoth ? okR : null)}</div>
        <span class="partsjp">左 ＋ 右</span></div>
    </div>
    ${step !== "done" ? `
      <div class="steplabel">${step === "L" ? "左側（偏）はどの形？" : "右側（旁）はどの形？"}<span>日本と同じ形のままのこともあります</span></div>
      <div class="options">${opts.map((o, k) => `<button class="opt part" data-part="${k}">${esc(o)}</button>`).join("")}</div>`
    : `<div class="buildresult">
        <div class="side cnside">${mizi(cnSpan(b.x.cn))}</div>
        <div class="txt">
          <div>${okL && okR ? `<strong class="okc">正解</strong>` : `<strong class="ngc">おしい</strong>`}</div>
          <div class="partline">${cnSpan(b.lc)} ＋ ${cnSpan(b.rc)} ＝ ${cnSpan(b.x.cn, "color:var(--jade);font-weight:700")}</div>
          <div style="display:flex;gap:8px;align-items:center">${pySpan(b.x.py, "font-size:20px")}${speakBtn(b.x.cn)}</div>
          <div class="mean">${esc(b.x.mean)}</div>
          ${[b.lj !== b.lc ? `左 ${b.lj}→${b.lc}` : `左 ${b.lj} はそのまま`, b.rj !== b.rc ? `右 ${b.rj}→${b.rc}` : `右 ${b.rj} はそのまま`].map((t) => `<span class="tag">${esc(t)}</span>`).join(" ")}
        </div>
      </div>
      <button class="btn primary" data-act="nextBuild">次の字</button>`}
  </div>`;
}

// ---- Card view ----
function newDeck() { state.deck = shuffle(pool()); state.pos = 0; state.flipped = false; }

function cardBody(x) {
  const f = state.flipped;
  if (x.kind === "pair") {
    return `<div class="pair">
      <div class="side jpside"><span class="label">日本の漢字</span>${mizi(`<span class="jp" lang="ja">${x.jp}</span>`, true)}</div>
      <span class="arrow" aria-hidden="true">→</span>
      <div class="side cnside"><span class="label">简体字</span>${mizi(f ? `<span class="cn" lang="zh-Hans">${x.cn}</span>` : `<span class="hidden-char">?</span>`)}</div>
    </div>
    <div class="meta">${f
      ? `<div style="display:flex;gap:10px;align-items:center">${pySpan(x.py)}${speakBtn(x.cn)}</div>

      : `<div class="mean">意味：${esc(x.mean)}</div><div class="mean">${x.parts.length ? `ヒント：部品 ${x.parts.map((k) => esc(k)).join("・")} に注目` : "简体字の形を思い浮かべてから、めくってください。"}</div>`}</div>`;
  }
  if (x.kind === "c") {
    return `<div class="pair">
      <div class="side jpside"><span class="label">日本語の意味</span><div class="glossbox">${esc(x.mean)}</div></div>
      <span class="arrow" aria-hidden="true">→</span>
      <div class="side cnside"><span class="label">简体字</span>${mizi(f ? `<span class="cn" lang="zh-Hans">${x.cn}</span>` : `<span class="hidden-char">?</span>`)}</div>
    </div>
    <div class="meta">${f
      ? `<div style="display:flex;gap:10px;align-items:center">${pySpan(x.py)}${speakBtn(x.ex)}</div>

  }
  return `<div class="wordbox">
      <span class="label">中国語での意味は？</span>
      <div class="word cn" lang="zh-Hans">${esc(x.cn)}</div>
      ${f ? `<div style="display:flex;gap:10px;align-items:center">${pySpan(x.py, "font-size:20px")}${speakBtn(x.cn)}</div>` : ""}
    </div>
    <div class="meta">${f
      ? `<div class="compare">
           <div><span class="k">中国語の意味</span><span class="v" style="color:var(--jade)">${esc(x.mean)}</span></div>
           <div class="jprow"><span class="k">日本語の「${esc(x.trap.replace(/（.*）/, ""))}」は</span>${cnSpan(x.jpword, "font-size:20px;color:var(--indigo)")}${pySpan(x.jpwordpy)}</div>
         </div>`
      : `<div class="trapnote">日本語なら <b>${esc(x.trap)}</b> ですが、中国語では？</div>`}</div>`;
}

function renderCard() {
  const el = $("#view-card");
  if (!state.deck.length) {
    el.innerHTML = `<div class="card result"><p>この条件の字はすべて覚えました。</p><button class="btn primary" data-act="clearFilter">範囲を「すべて」に戻す</button></div>`;
    return;
  }
  const x = state.deck[state.pos];
  const isKnown = known.has(key(x));
  el.innerHTML = `
  <div class="card">
    ${cardBody(x)}
    <div class="actions">
      ${state.flipped
        ? `<button class="btn" data-act="again">もう一度</button><button class="btn primary" data-act="got">覚えた</button>`
        : `<button class="btn primary full" data-act="flip">めくる</button>`}
    </div>
    <div class="cardfoot">
      <span>${state.pos + 1} / ${state.deck.length}${isKnown ? "　・覚えた字" : ""}</span>
      <span style="display:flex;gap:6px">
        <button class="btn ghost" style="padding:4px 10px;font-size:12px" data-act="prev">前へ</button>
        <button class="btn ghost" style="padding:4px 10px;font-size:12px" data-act="skip">次へ</button>
        <button class="btn ghost" style="padding:4px 10px;font-size:12px" data-act="reshuffle">シャッフル</button>
      </span>
    </div>
  </div>`;
}
function flipCard() { state.flipped = true; renderCard(); speak(sayText(state.deck[state.pos])); }
function nextCard() {
  state.flipped = false;
  if (state.pos < state.deck.length - 1) state.pos++;
  else newDeck();
  renderCard();
}
function openChar(id) {
  state.view = "card"; state.group = "all"; state.onlyUnknown = false;
  newDeck();
  const k = state.deck.findIndex((x) => x.id === id);
  if (k > 0) state.deck.unshift(state.deck.splice(k, 1)[0]);
  state.flipped = true;
  newQuiz(state.quiz ? state.quiz.dir : "jp2cn");
  render();
  speak(sayText(ALL[id]));
  window.scrollTo({ top: 0 });
}

// ---- Quiz view ----
const QLEN = 10;
function pickDistinct(cands, exclude, n) {
  const out = [];
  for (const c of cands) { if (out.length >= n) break; if (!exclude.includes(c) && !out.includes(c)) out.push(c); }
  return out;
}
function makeQuestion(x, dir) {
  if (x.kind === "f") {
    const others = shuffle(FALSE_FRIENDS.filter((y) => y.cn !== x.cn)).map((y) => y.mean);
    const opts = [x.mean, x.trap, ...pickDistinct(others, [x.mean, x.trap], 2)];
    return { x, type: "text", options: shuffle(opts), answer: x.mean, picked: null };
  }
  if (x.kind === "c") {
    const others = shuffle(CN_ONLY.filter((y) => y.cn !== x.cn && y.mean !== x.mean));
    if (dir === "jp2cn") return { x, type: "cn", options: shuffle([x.cn, ...pickDistinct(others.map((y) => y.cn), [x.cn], 3)]), answer: x.cn, picked: null };
    return { x, type: "text", options: shuffle([x.mean, ...pickDistinct(others.map((y) => y.mean), [x.mean], 3)]), answer: x.mean, picked: null };
  }
  const field = dir === "jp2cn" ? "cn" : "jp";
  const pairs = ALL.filter((y) => y.kind === "pair" && y.cn !== x.cn && y.jp !== x.jp);
  // 同じ部品を持つ字を優先して選択肢にする（部品で見分ける練習）
  const samePart = shuffle(pairs.filter((y) => y.parts.some((k) => x.parts.includes(k)))).map((y) => y[field]);
  const sameGroup = shuffle(pairs.filter((y) => y.g === x.g)).map((y) => y[field]);
  const rest = shuffle(pairs).map((y) => y[field]);
  return { x, type: field, options: shuffle([x[field], ...pickDistinct([...samePart, ...sameGroup, ...rest], [x[field]], 3)]), answer: x[field], picked: null };
}
function newQuiz(dir) {
  state.quiz = { dir, qs: shuffle(pool()).slice(0, QLEN).map((x) => makeQuestion(x, dir)), i: 0, done: false };
}
function quizPrompt(c, dir) {
  const x = c.x;
  if (x.kind === "f") return `<span class="label">中国語での意味は？</span><div class="word cn" lang="zh-Hans" style="font-size:64px">${esc(x.cn)}</div>`;
  if (x.kind === "c") {
    return dir === "jp2cn"
      ? `<span class="label">この意味の简体字は？</span><div class="glossbox">${esc(x.mean)}</div>`
      : `<span class="label">この字の意味は？</span>${mizi(cnSpan(x.cn, "color:var(--jade)"))}`;
  }
  return dir === "jp2cn"
    ? `<span class="label">この漢字の简体字は？</span>${mizi(jpSpan(x.jp, "color:var(--indigo)"), true)}`
    : `<span class="label">この简体字の日本漢字は？</span>${mizi(cnSpan(x.cn, "color:var(--jade)"))}`;
}
function answerLine(x) {
  if (x.kind === "pair") return `${jpSpan(x.jp)} → ${cnSpan(x.cn)} ${pySpan(x.py)}　${esc(x.mean)}${x.parts.length ? `<br><span class="tag parttag">部品 ${esc(partsLabel(x))}</span>` : ""}`;
  if (x.kind === "c") return `${cnSpan(x.cn)} ${pySpan(x.py)}　${esc(x.mean)}（${cnSpan(x.ex)}：${esc(x.exmean)}）`;
  return `${cnSpan(x.cn)} ${pySpan(x.py)}＝${esc(x.mean)}。日本語の「${esc(x.trap.replace(/（.*）/, ""))}」は ${cnSpan(x.jpword)}`;
}
function missLine(x) {
  if (x.kind === "pair") return `${jpSpan(x.jp, "color:var(--indigo)")} → ${cnSpan(x.cn, "color:var(--jade)")} ${pySpan(x.py, "font-size:13px")}`;
  return `${cnSpan(x.cn, "color:var(--jade)")} ${pySpan(x.py, "font-size:13px")} <span style="font-size:13px">${esc(x.mean)}</span>`;
}
function renderQuiz() {
  const el = $("#view-quiz");
  const q = state.quiz;
  const dirSwitch = `<div class="chips" style="justify-content:center">
      <button class="chip" data-qdir="jp2cn" aria-pressed="${!q || q.dir === "jp2cn"}">日本語 → 简体字</button>
      <button class="chip" data-qdir="cn2jp" aria-pressed="${!!q && q.dir === "cn2jp"}">简体字 → 日本語</button></div>`;
  if (!q || !q.qs.length) {
    el.innerHTML = `<div class="card result">${dirSwitch}<p>この条件では出題できる字がありません。</p><button class="btn primary" data-act="clearFilter">範囲を「すべて」に戻す</button></div>`;
    return;
  }
  const dots = `<div class="dots">${q.qs.map((c, k) => `<i class="${c.picked == null ? "" : c.options[c.picked] === c.answer ? "ok" : "ng"} ${k === q.i && !q.done ? "now" : ""}"></i>`).join("")}</div>`;
  if (q.done) {
    const ok = q.qs.filter((c) => c.options[c.picked] === c.answer).length;
    const miss = q.qs.filter((c) => c.options[c.picked] !== c.answer);
    el.innerHTML = `<div class="card result">${dots}
      <div class="score">${ok} / ${q.qs.length}</div>
      <p style="margin:0;color:var(--ink-soft)">${ok === q.qs.length ? "全問正解です。" : "間違えた字は「まだ覚えていない字」に戻しました。"}</p>
      ${miss.length ? `<div class="misslist">${miss.map((c) => `<span class="miss">${missLine(c.x)}</span>`).join("")}</div>` : ""}
      <button class="btn primary" data-act="newQuiz" style="min-width:200px">もう一回</button></div>`;
    return;
  }
  const c = q.qs[q.i];
  const answered = c.picked != null;
  const optCls = c.type === "text" ? "text" : c.type;
  const optLang = c.type === "cn" ? "zh-Hans" : "ja";
  let fb = "";
  if (answered) {
    const right = c.options[c.picked] === c.answer;
    fb = `${right ? `<strong class="ok">正解</strong>` : `<strong class="ng">不正解</strong>`}　${answerLine(c.x)} ${speakBtn(sayText(c.x))}`;
  }
  el.innerHTML = `<div class="card">${dirSwitch}${dots}
    <div class="qprompt">${quizPrompt(c, q.dir)}</div>
    <div class="options ${c.type === "text" ? "textopts" : ""}">${c.options.map((o, k) => {
      let cls = "";
      if (answered) { if (o === c.answer) cls = "right"; else if (k === c.picked) cls = "wrong"; }
      return `<button class="opt ${optCls} ${cls}" lang="${optLang}" data-opt="${k}" ${answered ? "disabled" : ""}>${esc(o)}</button>`;
    }).join("")}</div>
    <div class="feedback" aria-live="polite">${fb}</div>
    ${answered ? `<button class="btn primary" data-act="nextQ">${q.i < q.qs.length - 1 ? "次の問題" : "結果を見る"}</button>` : ""}
  </div>`;
}

// ---- Origins view ----
function renderRules() {
  const sections = ORIGINS.map((o) => {
    const items = ALL.filter((x) => x.g === o.key);
    return `<section class="origin">
      <div class="originhead"><h2>${o.name}</h2>
        ${o.key === "r" ? `<button class="chip" data-view="parts">パーツを見る</button>` : `<button class="chip" data-practice="${o.key}" data-to="card">この${items.length}字を練習</button>`}</div>
      <p class="intro">${o.desc}</p>
      ${o.key === "r" ? "" : `<div class="ex">${exampleBtns(items)}</div>`}
    </section>`;
  }).join("");
  $("#view-rules").innerHTML = `<div style="display:flex;flex-direction:column;gap:20px">
    <p class="intro">部品の類推で説明できない字は、ほかの決まった方法で作られています。作り方ごとにまとめました。分類は代表的な説明に沿ったもので、複数の由来が重なる字もあります。</p>
    ${sections}
  </div>`;
}

// ---- view switching ----
const VIEWS = ["parts", "build", "card", "quiz", "rules"];
function render() {
  for (const v of VIEWS) {
    $("#view-" + v).hidden = state.view !== v;
    $("#tab-" + v).setAttribute("aria-selected", state.view === v);
  }
  $("#filterBar").hidden = !(state.view === "card" || state.view === "quiz");
  renderSelect();
  $("#onlyUnknown").checked = state.onlyUnknown;
  if (state.view === "parts") renderParts();
  if (state.view === "build") renderBuild();
  if (state.view === "card") renderCard();
  if (state.view === "quiz") renderQuiz();
  if (state.view === "rules") renderRules();
}
function filtersChanged() {
  newDeck();
  newQuiz(state.quiz ? state.quiz.dir : "jp2cn");
  render();
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.speak) { speak(t.dataset.speak); return; }
  if (t.dataset.practice) {
    state.group = t.dataset.practice; state.onlyUnknown = false; state.view = t.dataset.to || "card";
    newDeck(); newQuiz(state.quiz ? state.quiz.dir : "jp2cn");
    if (state.view === "build") newBuildRound();
    render(); window.scrollTo({ top: 0 }); return;
  }
  if (t.dataset.view) { state.view = t.dataset.view; render(); return; }
  if (t.dataset.comp) { state.openComp = state.openComp === t.dataset.comp ? null : t.dataset.comp; renderParts(); return; }
  if (t.dataset.qdir) { newQuiz(t.dataset.qdir); renderQuiz(); return; }
  if (t.dataset.jump) { openChar(+t.dataset.jump); return; }
  if (t.dataset.part != null && state.build) {
    const c = state.build.cur, k = +t.dataset.part;
    if (c.l == null) c.l = c.optsL[k];
    else if (c.r == null) {
      c.r = c.optsR[k];
      const ok = c.l === c.b.lc && c.r === c.b.rc;
      state.build.n++; if (ok) state.build.ok++;
      if (ok) known.add(key(c.b.x)); else known.delete(key(c.b.x));
      saveKnown(); speak(c.b.x.cn);
    }
    renderBuild(); return;
  }
  if (t.dataset.opt != null && state.quiz) {
    const c = state.quiz.qs[state.quiz.i];
    if (c.picked != null) return;
    c.picked = +t.dataset.opt;
    if (c.options[c.picked] === c.answer) known.add(key(c.x)); else known.delete(key(c.x));
    saveKnown(); renderQuiz(); return;
  }
  const act = t.dataset.act;
  if (!act) return;
  if (act === "flip") flipCard();
  else if (act === "got") { known.add(key(state.deck[state.pos])); saveKnown(); nextCard(); }
  else if (act === "again") { known.delete(key(state.deck[state.pos])); saveKnown(); const x = state.deck.splice(state.pos, 1)[0]; state.deck.splice(Math.min(state.deck.length, state.pos + 4), 0, x); state.flipped = false; renderCard(); }
  else if (act === "skip") nextCard();
  else if (act === "prev") { state.flipped = false; state.pos = Math.max(0, state.pos - 1); renderCard(); }
  else if (act === "reshuffle") { newDeck(); renderCard(); }
  else if (act === "clearFilter") { state.group = "all"; state.onlyUnknown = false; filtersChanged(); }
  else if (act === "nextQ") { const q = state.quiz; if (q.i < q.qs.length - 1) q.i++; else q.done = true; renderQuiz(); }
  else if (act === "newQuiz") { newQuiz(state.quiz.dir); renderQuiz(); }
  else if (act === "nextBuild") { const B = state.build; B.i = (B.i + 1) % B.list.length; if (B.i === 0) B.list = shuffle(B.list); setBuildItem(); renderBuild(); }
  else if (act === "buildAll") { state.group = "all"; newBuildRound(); renderBuild(); }
});
$("#groupSel").addEventListener("change", (e) => { state.group = e.target.value; filtersChanged(); });
$("#onlyUnknown").addEventListener("change", (e) => { state.onlyUnknown = e.target.checked; filtersChanged(); });
document.addEventListener("keydown", (e) => {
  if (state.view !== "card" || e.target.closest("input, select, button")) return;
  if (e.key === " " || e.key === "Enter") { if (!state.flipped && state.deck.length) { e.preventDefault(); flipCard(); } }
  else if (e.key === "ArrowRight") nextCard();
  else if (e.key === "ArrowLeft") { state.flipped = false; state.pos = Math.max(0, state.pos - 1); renderCard(); }
});
if (canSpeak) { try { speechSynthesis.getVoices(); } catch (e) {} }

updateProgress();
newDeck();
newQuiz("jp2cn");
newBuildRound();
render();
</script>
</body>
</html>
